name: Conteúdo do dia (rodízio vídeo/carrossel/arte)

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Forçar tipo (vazio = o do dia): video, carrossel, arte'
        required: false
        default: ''
      formato:
        description: 'Se tipo=carrossel: forçar formato (vazio = rodízio por semana): foto, texto'
        required: false
        default: ''
      tema_foto:
        description: 'Se formato=foto: forçar tema (vazio = o da semana): iniciante, ate500, amort, leves'
        required: false
        default: ''
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

jobs:
  conteudo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Decidir o tipo do dia"
        id: tipo
        run: |
          # Calendario fixo por dia da semana (feed harmonico: 3-4 posts de grid/semana)
          #   Seg=carrossel  Ter=arte  Qua=video  Qui=arte  Sex=arte(cupom)  Sab=carrossel  Dom=folga
          FORCADO="${{ github.event.inputs.tipo }}"
          if [ -n "$FORCADO" ]; then
            TIPO="$FORCADO"
          else
            DOW=$(date -u +%u)   # 1=Seg ... 7=Dom
            case $DOW in
              1) TIPO=carrossel ;;
              2) TIPO=arte ;;
              3) TIPO=video ;;
              4) TIPO=arte ;;
              5) TIPO=arte ;;
              6) TIPO=carrossel ;;
              7) TIPO=folga ;;
            esac
          fi
          echo "tipo=$TIPO" >> "$GITHUB_OUTPUT"
          echo "Conteudo do dia: $TIPO"

      - name: Instalar dependencias
        run: pip install Pillow imageio-ffmpeg rembg onnxruntime

      - name: Cache do modelo de IA (rembg)
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-general

      - name: Instalar o Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Node (engine do carrossel foto)
        if: ${{ steps.tipo.outputs.tipo == 'carrossel' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar a engine carrossel_estilos (Playwright, sem baixar browser)
        if: ${{ steps.tipo.outputs.tipo == 'carrossel' }}
        working-directory: carrossel_estilos
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      - name: Gerar e enviar o conteudo do dia
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_CUPONS: ${{ secrets.EMAIL_CUPONS }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: '2800712'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          TEMA_FOTO: ${{ github.event.inputs.tema_foto }}
        run: |
          case "${{ steps.tipo.outputs.tipo }}" in
            video)     python3 gerar_video_tiktok.py ;;
            carrossel)
              # Dias de carrossel (Seg/Sab) alternam por semana ISO: par = formato FOTO,
              # impar = carrosseis de texto (pronada/ate300/versus). Feed com variedade.
              # No disparo manual, o input "formato" (foto/texto) sobrepoe o rodizio.
              FORMATO="${{ github.event.inputs.formato }}"
              if [ -z "$FORMATO" ]; then
                WK=$(date -u +%V)
                if [ $((10#$WK % 2)) -eq 0 ]; then FORMATO=foto; else FORMATO=texto; fi
              fi
              if [ "$FORMATO" = "foto" ]; then
                echo "Carrossel FOTO (formato=$FORMATO)"
                python3 gerar_carrossel_foto.py
              else
                echo "Carrossel de texto (formato=$FORMATO)"
                python3 gerar_carrossel_instagram.py
              fi
              ;;
            arte)      python3 gerar_arte_instagram.py ;;
            folga)     echo "Domingo: feed de folga, nenhum conteudo gerado." ;;
            *)         python3 gerar_arte_instagram.py ;;
          esac

      - name: Guardar o conteudo (backup)
        uses: actions/upload-artifact@v4
        with:
          name: conteudo-do-dia
          path: |
            carrossel_*.png
            arte_*.png
            video_tiktok.mp4
          retention-days: 7
          if-no-files-found: ignore
