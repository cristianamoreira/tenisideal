name: Conteúdo do dia (rodízio vídeo/carrossel/arte)

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Forçar tipo (vazio = o do dia): video, carrossel, arte'
        required: false
        default: ''
      formato:
        description: 'Se tipo=carrossel: forçar formato (vazio = rodízio por semana): foto, texto'
        required: false
        default: ''
      tema_foto:
        description: 'Se formato=foto: forçar tema (vazio = o da semana): iniciante, ate500, amort, leves'
        required: false
        default: ''
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write   # auto-commit da fila do banco de carrosséis (banco_posts/fila.json)

jobs:
  conteudo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Decidir o tipo do dia"
        id: tipo
        run: |
          # Calendario fixo por dia da semana (7 posts/semana)
          #   Seg=carrossel  Ter=arte  Qua=video  Qui=arte  Sex=arte(cupom)  Sab=carrossel  Dom=arte motivacional
          FORCADO="${{ github.event.inputs.tipo }}"
          if [ -n "$FORCADO" ]; then
            TIPO="$FORCADO"
          else
            DOW=$(date -u +%u)   # 1=Seg ... 7=Dom
            case $DOW in
              1) TIPO=carrossel ;;
              2) TIPO=arte ;;
              3) TIPO=video ;;
              4) TIPO=arte ;;
              5) TIPO=arte ;;
              6) TIPO=carrossel ;;
              7) TIPO=domingo ;;
            esac
          fi
          echo "tipo=$TIPO" >> "$GITHUB_OUTPUT"
          echo "Conteudo do dia: $TIPO"

      - name: Instalar dependencias
        run: pip install Pillow imageio-ffmpeg rembg onnxruntime

      - name: Cache do modelo de IA (rembg)
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-birefnet-general

      - name: Instalar o Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Node (engine do carrossel foto)
        if: ${{ steps.tipo.outputs.tipo == 'carrossel' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar a engine carrossel_estilos (Playwright, sem baixar browser)
        if: ${{ steps.tipo.outputs.tipo == 'carrossel' }}
        working-directory: carrossel_estilos
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      - name: Gerar e enviar o conteudo do dia
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_CUPONS: ${{ secrets.EMAIL_CUPONS }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: '2800712'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          TEMA_FOTO: ${{ github.event.inputs.tema_foto }}
        run: |
          case "${{ steps.tipo.outputs.tipo }}" in
            video)     python3 gerar_video_tiktok.py ;;
            carrossel)
              # 1º: tenta o banco de pré-aprovados. exit 3 = banco vazio -> gera na hora.
              set +e
              python3 carrossel_do_banco.py
              RC=$?
              set -e
              if [ "$RC" = "3" ]; then
                echo "::warning::Banco de carrosséis vazio — gerando na hora (reabastecer com a Claude)."
                # Rodizio por semana ISO: par = formato FOTO, impar = texto.
                FORMATO="${{ github.event.inputs.formato }}"
                if [ -z "$FORMATO" ]; then
                  WK=$(date -u +%V)
                  if [ $((10#$WK % 2)) -eq 0 ]; then FORMATO=foto; else FORMATO=texto; fi
                fi
                if [ "$FORMATO" = "foto" ]; then
                  echo "Carrossel FOTO (formato=$FORMATO)"
                  python3 gerar_carrossel_foto.py
                else
                  echo "Carrossel de texto (formato=$FORMATO)"
                  python3 gerar_carrossel_instagram.py
                fi
              elif [ "$RC" != "0" ]; then
                exit "$RC"
              fi
              ;;
            arte)      python3 gerar_arte_instagram.py ;;
            domingo)   FORMATO_ARTE=motivacional python3 gerar_arte_instagram.py ;;
            folga)     echo "Folga: nenhum conteudo gerado." ;;
            *)         python3 gerar_arte_instagram.py ;;
          esac

      - name: Commitar a fila do banco (se consumiu carrossel)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain banco_posts/fila.json)" ]; then
            git add banco_posts/fila.json
            git commit -m "Banco de posts: marca carrossel do dia como publicado (automático)"
            git pull --rebase origin main
            git push
            echo "✅ Fila do banco atualizada."
          else
            echo "ℹ️ Fila do banco sem mudanças hoje."
          fi

      - name: Guardar o conteudo (backup)
        uses: actions/upload-artifact@v4
        with:
          name: conteudo-do-dia
          path: |
            carrossel_*.png
            arte_*.png
            video_tiktok.mp4
          retention-days: 7
          if-no-files-found: ignore
