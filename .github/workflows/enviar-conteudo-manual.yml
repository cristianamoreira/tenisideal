name: Enviar conteudo (manual)

# Workflow manual: voce clica em "Run workflow" na aba Actions do GitHub, escolhe
# o que enviar (e, no carrossel, o ESTILO e o TEMA) e recebe por e-mail. Usa os
# mesmos secrets dos outros robos (Brevo).

on:
  workflow_dispatch:
    inputs:
      o_que:
        description: 'O que enviar por e-mail'
        required: true
        default: carrossel
        type: choice
        options:
          - carrossel
          - cupom-casual30
      estilo:
        description: 'Estilo do carrossel (so vale quando o_que = carrossel)'
        required: false
        default: brutalism
        type: choice
        options:
          - brutalism
          - glassmorphism-ibeia
          - ticket-zerotoui
          - editorial-magazine
          - swiss-grid
          - claymorphism
          - neo-newspaper
          - sticker-cutout
          - terminal-mono
          - flat-editorial-colorido
      tema:
        description: 'Tema do carrossel (so vale quando o_que = carrossel)'
        required: false
        default: pronada
        type: choice
        options:
          - pronada
          - ate300
          - versus

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias Python
        run: pip install Pillow

      - name: Instalar o Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Instalar a engine de carrossel (Playwright, sem baixar browser)
        if: ${{ github.event.inputs.o_que == 'carrossel' }}
        working-directory: carrossel_estilos
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      - name: Gerar e enviar
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_CUPONS: ${{ secrets.EMAIL_CUPONS }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CUPOM_ENVIAR: '1'
          ESTILO_CARROSSEL: ${{ github.event.inputs.estilo }}
          TEMA_CARROSSEL: ${{ github.event.inputs.tema }}
        run: |
          case "${{ github.event.inputs.o_que }}" in
            carrossel)      python3 gerar_carrossel_estilo.py ;;
            cupom-casual30) python3 gerar_arte_cupom.py ;;
          esac

      - name: Guardar as artes (backup p/ download)
        uses: actions/upload-artifact@v4
        with:
          name: conteudo-manual
          path: |
            carrossel_*.png
            arte_cupom_manual.png
          retention-days: 7
          if-no-files-found: ignore
